# Staging: deploy from branch "release" (GitHub Actions) into org stg-goenablers
app = "page-orientation-api-stg"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    APP_ENV = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpus = 1
  memory_mb = 1024
