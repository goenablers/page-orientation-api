# Production: deploy from branch "master" (GitHub Actions) into org prd-goenablers
app = "page-orientation-api-prd"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    APP_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "4gb"
  cpus = 2
  memory_mb = 4096
  cpu_kind = "performance"
